spring.application.name=mini-projet-sprint-03
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/mini_projet_sprint03?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
server.servlet.context-path=/produits
spring.data.rest.base-path=/
app.jwt.secret=${JWT_SECRET:MiniProjetSprint03SecretKeyForLocalDevelopment1234567890}
app.jwt.expiration-ms=86400000
